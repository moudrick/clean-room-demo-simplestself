    environment:
      LD_EVALUATION_SDK_KEY: ${LD_EVALUATION_SDK_KEY_TEST:?missing test SDK key}
    command: ["npm", "run", "traffic", "--", "--profile", "test"]

  orders-dev:
    <<: *orders
    environment:
      LD_EVALUATION_SDK_KEY: ${LD_EVALUATION_SDK_KEY_DEV:?missing dev SDK key}
    command: ["npm", "run", "traffic", "--", "--profile", "dev"]
  storefront-dev:
