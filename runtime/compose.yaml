# Generated from the compiled scenario. Do not edit by hand; change scenario/steps and reapply.
x-runtime-environment: &runtime-environment
  DEMO_GENERATION_ID: ${DEMO_GENERATION_ID:?missing demo generation}

x-rotated-logs: &rotated-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-catalog: &catalog
  build: ./repos/demo-catalog
  image: clean-room-demo/demo-catalog:local
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *rotated-logs

x-orders: &orders
  build: ./repos/demo-orders
  image: clean-room-demo/demo-orders:local
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
