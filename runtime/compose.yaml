    command: ["npm", "run", "traffic", "--", "--profile", "staging"]
  profile-staging:
    <<: *profile
    environment:
      LD_EVALUATION_SDK_KEY: ${LD_EVALUATION_SDK_KEY_STAGING:?missing staging SDK key}
    command: ["npm", "run", "traffic", "--", "--profile", "staging"]

  orders-test:
    <<: *orders
    environment:
      LD_EVALUATION_SDK_KEY: ${LD_EVALUATION_SDK_KEY_TEST:?missing test SDK key}
    command: ["npm", "run", "traffic", "--", "--profile", "test"]
  storefront-test:
