x-runtime-environment: &runtime-environment
  DEMO_GENERATION_ID: ${DEMO_GENERATION_ID:?missing demo generation}

x-orders: &orders
  build: ./repos/demo-orders
  image: clean-room-demo/demo-orders:local
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  logging: &rotated-logs
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-storefront: &storefront
  build: ./repos/demo-storefront
  image: clean-room-demo/demo-storefront:local
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *rotated-logs

x-profile: &profile
  build: ./repos/demo-profile
  image: clean-room-demo/demo-profile:local
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *rotated-logs

services:
  orders-production:
    <<: *orders
    environment:
      <<: *runtime-environment
      LD_EVALUATION_SDK_KEY: ${LD_EVALUATION_SDK_KEY_PRODUCTION:?missing production SDK key}
      DEMO_ENVIRONMENT: production
      DEMO_EVALUATIONS_PER_HOUR: ${DEMO_EVALUATIONS_PER_HOUR:-1200}
      DEMO_CONTEXT_POOL_SIZE: ${DEMO_CONTEXT_POOL_SIZE:-1000}
    command: ["npm", "run", "traffic", "--", "--profile", "production"]
  storefront-production:
    <<: *storefront
    environment:
      <<: *runtime-environment
      LD_EVALUATION_SDK_KEY: ${LD_EVALUATION_SDK_KEY_PRODUCTION:?missing production SDK key}
      DEMO_ENVIRONMENT: production
    command: ["npm", "run", "traffic", "--", "--profile", "production"]
  profile-production:
    <<: *profile
    environment:
      <<: *runtime-environment
      LD_EVALUATION_SDK_KEY: ${LD_EVALUATION_SDK_KEY_PRODUCTION:?missing production SDK key}
      DEMO_ENVIRONMENT: production
    command: ["npm", "run", "traffic", "--", "--profile", "production"]

  orders-staging:
