name: Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check CLI syntax
        run: node --check demo.mjs
      - name: Check library syntax
        run: node --check lib.mjs
      - name: Run mocked tests
        run: npm test
